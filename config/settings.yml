plugins:
  discourse_post_geoip_enabled:
    default: true
  discourse_post_geoip_show_ip:
    default: true
  discourse_post_geoip_show_location:
    default: true
  discourse_post_geoip_location_granularity:
    type: enum
    default: city
    choices:
      - country
      - region
      - city
  discourse_post_geoip_ipv4_visible_octets:
    default: 2
    min: 1
    max: 3
  discourse_post_geoip_ipv6_visible_groups:
    default: 4
    min: 1
    max: 7
  discourse_post_geoip_show_in_private_messages:
    default: true
  discourse_post_geoip_delete_on_post_destroy:
    default: false
